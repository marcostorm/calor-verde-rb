<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ranking de setores — Calor & Verde Rio Branco</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Nunito+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
  :root{
    --serif:'Lora',ui-serif,Georgia,'Times New Roman',serif;
    --sans:'Nunito Sans',system-ui,-apple-system,sans-serif;
    --bg-page:#eef2eb;
    --bg-card:#e3ead8;
    --bg-strong:#d4ddc6;
    --border-soft:#c4cfb0;
    --border-strong:#a8b593;
    --text:#1a2621;
    --text-muted:#5a6b63;
    --text-faint:#889590;
    --accent:#2d5a3d;
    --accent-soft:#6b8e5a;
    --nivel-baixa:#feb24c;
    --nivel-media:#fd8d3c;
    --nivel-alta:#fc4e2a;
    --nivel-critica:#b10026;
  }
  html,body{margin:0;font-family:var(--sans);color:var(--text);background:var(--bg-page);font-size:14px;line-height:1.5}
  .wrap{max-width:1200px;margin:0 auto;padding:28px 24px 48px}
  h1{font-family:var(--serif);font-size:30px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px;line-height:1.15}
  .sub{color:var(--text-muted);margin-bottom:16px;max-width:68ch}
  .nav{margin-bottom:4px}
  .nav a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--border-strong);padding-bottom:1px;margin-right:16px;font-size:13px}
  .nav a:hover{color:var(--text);border-color:var(--accent)}
  .filtros{background:var(--bg-card);border:1px solid var(--border-strong);border-radius:3px;padding:14px 16px;margin:20px 0 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 18px}
  .filtros .campo label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin-bottom:5px}
  .filtros input[type=text],.filtros select{width:100%;box-sizing:border-box;padding:6px 8px;border:1px solid var(--border-soft);border-radius:3px;background:#fff;font-family:var(--sans);font-size:13px;color:var(--text)}
  .filtros .radios{display:flex;gap:14px;font-size:13px;align-items:center}
  .filtros .radios label{color:var(--text)}
  .filtros .check-wrap{display:flex;align-items:flex-end}
  .filtros .check-wrap label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text);cursor:pointer}
  input[type=radio],input[type=checkbox]{accent-color:var(--accent)}
  .status{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:13px;color:var(--text-muted);gap:12px;flex-wrap:wrap}
  .status button{background:var(--bg-page);border:1px solid var(--border-strong);border-radius:3px;color:var(--text);font-family:var(--sans);font-size:12px;padding:6px 14px;cursor:pointer}
  .status button:hover{background:var(--bg-strong)}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border-soft);font-size:13px;font-variant-numeric:tabular-nums}
  thead th{background:var(--bg-strong);color:var(--text);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:10px 8px;text-align:left;border-bottom:1px solid var(--border-strong);cursor:pointer;user-select:none;white-space:nowrap}
  thead th.r{text-align:right}
  thead th:hover{background:var(--border-strong);color:#fff}
  thead th .arrow{opacity:.3;margin-left:4px;font-size:10px}
  thead th.sorted{background:var(--border-strong);color:#fff}
  thead th.sorted .arrow{opacity:1}
  tbody td{padding:7px 8px;border-bottom:1px solid var(--border-soft);vertical-align:top}
  tbody td.r{text-align:right}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--bg-page)}
  tbody tr.expanded{background:var(--bg-card)}
  .nivel{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:500;min-width:52px;text-align:center;margin-left:4px;color:#fff;vertical-align:1px}
  .nivel.baixa{background:var(--nivel-baixa);color:var(--text)}
  .nivel.media{background:var(--nivel-media)}
  .nivel.alta{background:var(--nivel-alta)}
  .nivel.critica{background:var(--nivel-critica)}
  .buffer-tag{color:#b8860b;font-size:11px;margin-left:4px}
  .detail-row td{background:var(--bg-page);padding:0;border-bottom:1px solid var(--border-strong)}
  .detail{padding:14px 18px;border-left:3px solid var(--border-strong)}
  .detail dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:4px 24px;margin:0}
  .detail dt{color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-top:6px}
  .detail dd{margin:0;font-size:13px;color:var(--text)}
  .detail dd .obs{color:var(--text-muted);font-size:12px}
  .empty{text-align:center;padding:36px;color:var(--text-faint);font-style:italic}
  .thermo{display:inline-block;vertical-align:-0.1em;margin-right:3px;color:var(--nivel-alta);opacity:.85}
  @media (max-width:720px){
    thead th:nth-child(3),tbody td:nth-child(3){display:none}
    thead th:nth-child(6),tbody td:nth-child(6){display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ranking de setores — Rio Branco</h1>
  <p class="sub">Lista completa dos setores censitários do IBGE, ordenados pela fila de plantio. Clique numa linha para ver todos os dados; clique no cabeçalho de uma coluna para ordenar.</p>
  <nav class="nav">
    <a href="viewer.html">Ver no mapa</a>
    <a href="metodo.html">Metodologia</a>
  </nav>

  <div class="filtros">
    <div class="campo">
      <label>Versão</label>
      <div class="radios">
        <label><input type="radio" name="ver" value="conservador" checked> Só confiável</label>
        <label><input type="radio" name="ver" value="amplo"> Mapa inteiro</label>
      </div>
    </div>
    <div class="campo">
      <label>Busca</label>
      <input id="q" type="text" placeholder="bairro ou código do setor…">
    </div>
    <div class="campo">
      <label>Nível de prioridade</label>
      <select id="nivel">
        <option value="">Todos</option>
        <option value="critica">Crítica (85 ou mais)</option>
        <option value="alta">Alta (55 a 85)</option>
        <option value="media">Média (25 a 55)</option>
        <option value="baixa">Baixa (até 25)</option>
      </select>
    </div>
    <div class="campo check-wrap">
      <label><input id="only-buffer" type="checkbox"> Só setores estimados por buffer</label>
    </div>
  </div>

  <div class="status">
    <span id="count">carregando…</span>
    <button id="dl">Baixar CSV filtrado</button>
  </div>

  <table id="t">
    <thead><tr id="th-row"></tr></thead>
    <tbody id="tb"></tbody>
  </table>
</div>

<script>
const NUM_COLS = new Set(['rank','indice_prioridade','lst_mean','lst_percentile_90','anomalia_calor','ndvi_atual_mean','ndvi_delta','perda_ha','perda_pct','area_ha','cobertura_calor','pct_arborizacao']);

const fmtNum = (n, d=1) => n==null || !isFinite(n) ? '—' : Number(n).toLocaleString('pt-BR', {minimumFractionDigits:d, maximumFractionDigits:d});
const THERMO = '<svg class="thermo" viewBox="0 0 10 16" width="8" height="12" aria-hidden="true"><rect x="3.5" y="1.5" width="3" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.1"/><circle cx="5" cy="12" r="2.2" fill="currentColor"/></svg>';
const nivelKey = v => v==null ? null : v>=85 ? 'critica' : v>=55 ? 'alta' : v>=25 ? 'media' : 'baixa';
const nivelLabel = v => ({critica:'crítica', alta:'alta', media:'média', baixa:'baixa'})[nivelKey(v)] || '—';

function norm(s){
  return (s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
}

const COLS = [
  {k:'rank', l:'#', align:'r', fmt:v=>v==null?'—':v},
  {k:'nome', l:'Setor', fmt:(v,r)=>{
    const base = v ? `<span title="${v}">${v.slice(-3)}</span>` : '—';
    const tag = r.interpolado ? '<span class="buffer-tag" title="estimado por buffer">(est.)</span>' : '';
    return base + tag;
  }},
  {k:'bairro', l:'Bairro', fmt:v=>v||'—'},
  {k:'indice_prioridade', l:'Prioridade', align:'r', fmt:v=>{
    if (v==null) return '—';
    return `${fmtNum(v)}<span class="nivel ${nivelKey(v)}">${nivelLabel(v)}</span>`;
  }},
  {k:'lst_mean', l:'<svg class="thermo" viewBox="0 0 10 16" width="8" height="12" aria-hidden="true"><rect x="3.5" y="1.5" width="3" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.1"/><circle cx="5" cy="12" r="2.2" fill="currentColor"/></svg>°C médio', align:'r', fmt:v=>fmtNum(v)},
  {k:'anomalia_calor', l:'Anomalia', align:'r', fmt:v=>v==null?'—':(v>0?'+':'')+fmtNum(v)},
  {k:'ndvi_atual_mean', l:'Vegetação', align:'r', fmt:v=>fmtNum(v,2)},
  {k:'perda_pct', l:'% perdida', align:'r', fmt:v=>v==null?'—':fmtNum(v,0)+'%'},
  {k:'pct_arborizacao', l:'Arborização', align:'r', fmt:v=>v==null?'—':fmtNum(v,0)+'%'},
  {k:'cobertura_calor', l:'Confiança', align:'r', fmt:v=>v==null?'—':(v*100).toFixed(0)+'%'},
];

let rows = [];
let sort = {col:'rank', dir:1};
let currentVer = 'conservador';

function parseCSV(text){
  const lines = text.trim().split('\n');
  const header = lines[0].split(',');
  return lines.slice(1).map(line => {
    const parts = line.split(',');
    const o = {};
    header.forEach((h, i) => {
      const v = parts[i];
      if (v === '' || v == null) o[h] = null;
      else if (NUM_COLS.has(h)) {
        const n = Number(v);
        o[h] = isFinite(n) ? n : null;
      }
      else if (v === 'True') o[h] = true;
      else if (v === 'False') o[h] = false;
      else o[h] = v;
    });
    return o;
  });
}

function load(ver){
  document.getElementById('count').textContent = 'carregando…';
  fetch(`ranking_${ver}.csv`).then(r=>r.text()).then(txt=>{
    rows = parseCSV(txt);
    render();
  }).catch(e => {
    document.getElementById('count').textContent = 'erro ao carregar: ' + e.message;
  });
}

function filtered(){
  const q = norm(document.getElementById('q').value.trim());
  const nivel = document.getElementById('nivel').value;
  const onlyBuffer = document.getElementById('only-buffer').checked;
  return rows.filter(r => {
    if (onlyBuffer && !r.interpolado) return false;
    if (nivel) {
      if (nivelKey(r.indice_prioridade) !== nivel) return false;
    }
    if (q) {
      const hay = norm((r.bairro||'') + ' ' + (r.nome||''));
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function sortRows(data){
  const {col, dir} = sort;
  return [...data].sort((a,b)=>{
    const va = a[col], vb = b[col];
    if (va==null && vb==null) return 0;
    if (va==null) return 1;
    if (vb==null) return -1;
    if (typeof va === 'number' && typeof vb === 'number') return (va-vb)*dir;
    return String(va).localeCompare(String(vb), 'pt-BR') * dir;
  });
}

function renderHeader(){
  const row = document.getElementById('th-row');
  row.innerHTML = COLS.map(c => {
    const sorted = sort.col === c.k;
    const arrow = sorted ? (sort.dir>0?'▲':'▼') : '↕';
    return `<th data-k="${c.k}" class="${sorted?'sorted':''}${c.align==='r'?' r':''}">${c.l}<span class="arrow">${arrow}</span></th>`;
  }).join('');
  row.querySelectorAll('th').forEach(th => {
    th.onclick = () => {
      const k = th.dataset.k;
      if (sort.col === k) sort.dir *= -1;
      else sort = {col: k, dir: (k==='rank'||k==='nome'||k==='bairro') ? 1 : -1};
      render();
    };
  });
}

function render(){
  renderHeader();
  const data = sortRows(filtered());
  document.getElementById('count').textContent =
    `Mostrando ${data.length.toLocaleString('pt-BR')} de ${rows.length.toLocaleString('pt-BR')} setores`;
  const tb = document.getElementById('tb');
  if (!data.length) {
    tb.innerHTML = `<tr><td colspan="${COLS.length}" class="empty">Nenhum setor com esses filtros.</td></tr>`;
    return;
  }
  tb.innerHTML = data.map((r, i) => rowHTML(r, i)).join('');
  tb.querySelectorAll('tr[data-i]').forEach(tr => {
    tr.onclick = () => toggleDetail(tr, data[+tr.dataset.i]);
  });
}

function rowHTML(r, i){
  const tds = COLS.map(c => {
    const content = c.fmt(r[c.k], r);
    return `<td class="${c.align==='r'?'r':''}">${content}</td>`;
  }).join('');
  return `<tr data-i="${i}">${tds}</tr>`;
}

function toggleDetail(tr, r){
  const next = tr.nextElementSibling;
  if (next && next.classList.contains('detail-row')) {
    next.remove();
    tr.classList.remove('expanded');
    return;
  }
  document.querySelectorAll('.detail-row').forEach(d => d.remove());
  document.querySelectorAll('tr.expanded').forEach(x => x.classList.remove('expanded'));
  tr.classList.add('expanded');

  const anom = r.anomalia_calor;
  const anomTxt = anom==null ? '—'
    : anom>0 ? `${THERMO}${fmtNum(anom)} °C acima da média da cidade`
             : `${THERMO}${fmtNum(Math.abs(anom))} °C abaixo da média da cidade`;
  const ndviDelta = r.ndvi_delta==null ? '—'
    : (r.ndvi_delta>0?'+':'') + fmtNum(r.ndvi_delta, 2);
  const posicao = r.rank ? `${r.rank}º` : 'fora do ranking confiável';
  const nivel = r.indice_prioridade==null ? '—' : nivelLabel(r.indice_prioridade);

  const dr = document.createElement('tr');
  dr.className = 'detail-row';
  dr.innerHTML = `<td colspan="${COLS.length}"><div class="detail"><dl>
    <div><dt>Código IBGE</dt><dd>${r.nome ?? '—'}</dd></div>
    <div><dt>Posição na fila</dt><dd>${posicao}</dd></div>
    <div><dt>Prioridade</dt><dd>${fmtNum(r.indice_prioridade)} de 100 <span class="obs">(${nivel})</span></dd></div>
    <div><dt>Temperatura do chão (média)</dt><dd>${THERMO}${fmtNum(r.lst_mean)} °C <span class="obs">(${anomTxt})</span></dd></div>
    <div><dt>Temperatura do chão (top 10% do setor)</dt><dd>${THERMO}${fmtNum(r.lst_percentile_90)} °C <span class="obs">(p90)</span></dd></div>
    <div><dt>Vegetação (índice NDVI)</dt><dd>${fmtNum(r.ndvi_atual_mean,2)} <span class="obs">(variação ${ndviDelta} desde 2019)</span></dd></div>
    <div><dt>Vegetação perdida</dt><dd>${fmtNum(r.perda_ha,2)} ha <span class="obs">(${fmtNum(r.perda_pct,0)}% do setor)</span></dd></div>
    <div><dt>Arborização na calçada</dt><dd>${r.pct_arborizacao==null?'—':fmtNum(r.pct_arborizacao,0)+'% dos moradores'} <span class="obs">(IBGE 2022)</span></dd></div>
    <div><dt>Área do setor</dt><dd>${fmtNum(r.area_ha,1)} ha</dd></div>
    <div><dt>Confiança do dado</dt><dd>${r.cobertura_calor==null?'—':(r.cobertura_calor*100).toFixed(0)+'%'} <span class="obs">(pixels livres de nuvem/sombra)</span></dd></div>
    <div><dt>Origem dos dados</dt><dd>${r.interpolado?'estimado por buffer de 3,5 km (±2,3 °C)':'pixels próprios do setor'}</dd></div>
  </dl></div></td>`;
  tr.after(dr);
}

function toCSV(data){
  const header = ['rank','codigo_ibge','setor_curto','bairro','prioridade','nivel','lst_mean_C','lst_p90_C','anomalia_C','ndvi_atual','ndvi_delta','perda_ha','perda_pct','arborizacao_pct','area_ha','cobertura_calor','estimado_por_buffer'];
  const bodyRows = data.map(r => [
    r.rank ?? '',
    r.nome ?? '',
    r.nome ? r.nome.slice(-3) : '',
    r.bairro ?? '',
    r.indice_prioridade ?? '',
    nivelLabel(r.indice_prioridade),
    r.lst_mean ?? '',
    r.lst_percentile_90 ?? '',
    r.anomalia_calor ?? '',
    r.ndvi_atual_mean ?? '',
    r.ndvi_delta ?? '',
    r.perda_ha ?? '',
    r.perda_pct ?? '',
    r.pct_arborizacao ?? '',
    r.area_ha ?? '',
    r.cobertura_calor ?? '',
    r.interpolado ? 'sim' : 'nao',
  ]);
  const esc = v => {
    const s = String(v);
    return /[,"\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  };
  return [header, ...bodyRows].map(r => r.map(esc).join(',')).join('\n');
}

document.getElementById('dl').onclick = () => {
  const data = sortRows(filtered());
  const csv = toCSV(data);
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `calor-verde-rb_ranking_${currentVer}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
};

document.querySelectorAll('input[name=ver]').forEach(r => r.onchange = e => {
  currentVer = e.target.value;
  load(currentVer);
});
['q','nivel','only-buffer'].forEach(id => {
  const el = document.getElementById(id);
  el.oninput = render;
  el.onchange = render;
});

load('conservador');
</script>
</body>
</html>
