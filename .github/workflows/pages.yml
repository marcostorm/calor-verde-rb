name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'data/out/**'
      - 'relatorios/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare _site from data/out
        run: |
          mkdir -p _site
          cp -r data/out/. _site/
          # relatórios PDF ficam acessíveis em /relatorios/
          if [ -d relatorios ]; then
            mkdir -p _site/relatorios
            cp -r relatorios/. _site/relatorios/
          fi
          # viewer.html é a landing page do site
          cp _site/viewer.html _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
